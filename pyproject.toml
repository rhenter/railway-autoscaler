[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["railway_autoscaler"]

[project]
name = "railway-autoscaler"
version = "0.1.0"
description = "Django Railway autoscaler scaffold with environment limits and an offline policy simulator"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
     "Django>=6",
     "celery",
     "cryptography>=46",
     "dj-config-url>=0.1.1",
     "prettyconf>=3.0.1",
     "requests>=2.32",
]

[project.scripts]
railway-autoscaler = "railway_autoscaler.offline.cli:main"

[dependency-groups]
test = [
    "mock>=5.2.0",
    "mockredis>=0.1.3.dev0",
    "pytest>=9.1.1",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "fakeredis>=2.40.0",
    "requests"
]
dev = [
    { include-group = "test" },
    "ipdb",
    "ruff>=0.14,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
