[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "railway-autoscaler"
version = "0.1.0"
description = "Local policy simulator and starting point for a Railway horizontal autoscaler"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
railway-autoscaler = "railway_autoscaler.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
